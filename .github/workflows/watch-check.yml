name: 관심 단지 매물 확인

on:
  schedule:
    # 20분마다. GitHub 무료 크론은 실행이 지연될 수 있고,
    # 저장소가 60일간 비활성이면 스케줄이 자동 비활성화된다.
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 매물 확인 엔드포인트 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET 시크릿이 설정되지 않았습니다." >&2
            exit 1
          fi

          response=$(mktemp)
          status=$(curl -sS -o "$response" -w "%{http_code}" \
            --max-time 120 \
            -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/watches/check")

          echo "HTTP $status"
          cat "$response"
          echo

          if [ "$status" != "200" ]; then
            exit 1
          fi
