name: 오늘의 운동 알림

on:
  # 스케줄 일시 중지 중.
  #
  # APP_URL / CRON_SECRET 시크릿이 아직 없어서 실행할 때마다 실패하고,
  # 그때마다 실패 알림 메일이 온다. 아래 설정을 마친 뒤 주석을 풀면 된다.
  #
  #   1. Vercel 환경변수: DATABASE_URL, CRON_SECRET,
  #      TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (등록 후 재배포)
  #   2. prisma migrate deploy 1회
  #   3. GitHub Actions secrets: APP_URL, CRON_SECRET
  #      (CRON_SECRET은 Vercel 쪽과 같은 값이어야 한다)
  #
  # 재개 전에는 workflow_dispatch로 수동 실행해 200이 나오는지 먼저 확인할 것.
  #
  # schedule:
  #   # 매일 저녁 7시(KST) 알림. GitHub 무료 크론은 실행이 지연될 수 있고
  #   # 저장소가 60일간 비활성이면 자동 비활성화된다.
  #   - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 운동 알림 엔드포인트 호출
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET 시크릿이 설정되지 않았습니다." >&2
            exit 1
          fi

          response=$(mktemp)
          status=$(curl -sS -o "$response" -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/workout/remind")

          echo "HTTP $status"
          cat "$response"
          echo

          if [ "$status" != "200" ]; then
            exit 1
          fi
